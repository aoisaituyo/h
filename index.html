
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>History</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #101114;
  color: #f4f4f5;
  font-family: Arial, sans-serif;
}
header {
  padding: 22px 6%;
  border-bottom: 1px solid #292a30;
  font-size: 22px;
  font-weight: bold;
}
main {
  width: min(850px, 92%);
  margin: 70px auto;
}
h1 { font-size: 36px; }
p { color: #a1a1aa; }
form {
  display: flex;
  gap: 10px;
  margin-top: 25px;
}
input {
  flex: 1;
  min-width: 0;
  padding: 15px;
  border: 1px solid #383a42;
  border-radius: 10px;
  background: #1c1d22;
  color: white;
  font-size: 16px;
}
button {
  padding: 0 22px;
  border: 0;
  border-radius: 10px;
  cursor: pointer;
  font-weight: bold;
}
.player {
  margin-top: 28px;
  aspect-ratio: 16 / 9;
  background: #080808;
  border-radius: 12px;
  overflow: hidden;
}
iframe { width: 100%; height: 100%; border: 0; }
</style>
</head>
<body>
<header>History</header>
<main>
  <h1>動画を開く</h1>
  <p>動画のURLを入力してください。</p>
  <form id="form">
    <input id="url" placeholder="YouTubeのURLを入力..." required>
    <button type="submit">開く</button>
  </form>
  <div class="player" id="player"></div>
  <p id="message">動画URLを入力してね。</p>
</main>
<script>
const form = document.getElementById("form");
const input = document.getElementById("url");
const player = document.getElementById("player");
const message = document.getElementById("message");

form.addEventListener("submit", event => {
  event.preventDefault();

  try {
    const url = new URL(input.value.trim());
    let id = "";

    if (url.hostname === "youtu.be") {
      id = url.pathname.slice(1);
    } else if (
      ["youtube.com", "www.youtube.com", "m.youtube.com"]
        .includes(url.hostname)
    ) {
      if (url.pathname === "/watch") {
        id = url.searchParams.get("v") || "";
      } else if (url.pathname.startsWith("/shorts/")) {
        id = url.pathname.split("/")[2] || "";
      } else if (url.pathname.startsWith("/embed/")) {
        id = url.pathname.split("/")[2] || "";
      }
    }

    if (!/^[\w-]{11}$/.test(id)) {
      throw new Error("YouTubeの動画URLを確認してね。");
    }

    const iframe = document.createElement("iframe");
    iframe.src = "https://www.youtube.com/embed/" +
  encodeURIComponent(id);
    iframe.title = "動画プレイヤー";
    iframe.referrerPolicy = "strict-origin-when-cross-origin";
    iframe.allow =
      "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share";
    iframe.allowFullscreen = true;

    player.replaceChildren(iframe);
    message.textContent =
      "動画を読み込み中。再生できない場合は接続制限などを確認してね。";
  } catch (error) {
    player.replaceChildren();
    message.textContent = error.message ||
      "有効なYouTube動画URLを入力してね。";
  }
});
</script>
</body>
</html>
